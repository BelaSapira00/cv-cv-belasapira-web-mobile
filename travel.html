<div class="card">

  <h2>
    Smart Travel Weather 🌍
  </h2>

  <input 
    type="text" 
    id="cityInput" 
    placeholder="Masukkan kota tujuan"
  >

  <button onclick="cekPerjalanan()">
    Cek Perjalanan
  </button>

  <div id="result" style="margin-top:20px;"></div>

</div>



<style>

#cityInput{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid #ddd;
  margin-top:15px;
  outline:none;
}

button{
  margin-top:15px;
  padding:12px 20px;
  border:none;
  border-radius:12px;
  background:#1e2a38;
  color:white;
  cursor:pointer;
  font-weight:bold;
}

button:hover{
  background:#f8c8dc;
  color:#1e2a38;
}

.weather-box{
  background:#fdf2f7;
  padding:15px;
  border-radius:15px;
  margin-top:15px;
  line-height:1.8;
}

</style>



<script>

// 🌍 GEO API
async function getCoordinates(city){

  const response = await fetch(
    `https://geocoding-api.open-meteo.com/v1/search?name=${city}&count=1&language=id&format=json`
  );

  const data = await response.json();

  if(!data.results){
    return null;
  }

  return {
    lat: data.results[0].latitude,
    lon: data.results[0].longitude,
    name: data.results[0].name,
    country: data.results[0].country
  };

}



// 🌦️ WEATHER API
async function getWeather(lat,lon){

  const response = await fetch(
    `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,wind_speed_10m&timezone=Asia%2FBangkok`
  );

  return await response.json();

}



// 🎯 WEATHER CODE
function getWeatherDescription(code){

  if(code == 0){
    return "☀️ Cerah";
  }

  else if(code <= 3){
    return "☁️ Berawan";
  }

  else if(code <= 48){
    return "🌫️ Berkabut";
  }

  else if(code <= 67){
    return "🌧️ Hujan";
  }

  else if(code <= 77){
    return "❄️ Salju";
  }

  else if(code <= 99){
    return "⛈️ Badai";
  }

  return "🌍 Cuaca tidak diketahui";

}



// 🚀 MAIN FUNCTION
async function cekPerjalanan(){

  const city = document.getElementById(
    "cityInput"
  ).value;

  const result = document.getElementById(
    "result"
  );



  if(city == ""){

    result.innerHTML = `
      <p>
        ⚠️ Masukkan nama kota dulu ya
      </p>
    `;

    return;

  }



  result.innerHTML = `
    <p>
      ⏳ Sedang mencari cuaca...
    </p>
  `;



  try{

    // GEO
    const lokasi = await getCoordinates(
      city
    );



    if(!lokasi){

      result.innerHTML = `
        <p>
          ❌ Kota tidak ditemukan
        </p>
      `;

      return;

    }



    // WEATHER
    const weather = await getWeather(
      lokasi.lat,
      lokasi.lon
    );



    const suhu =
      weather.current.temperature_2m;

    const angin =
      weather.current.wind_speed_10m;

    const code =
      weather.current.weather_code;



    const kondisi =
      getWeatherDescription(code);



    // REKOMENDASI
    let rekomendasi =
      "✨ Cuaca aman buat perjalanan";



    if(code >= 51){

      rekomendasi =
        "🌧️ Jangan lupa bawa payung atau jas hujan";

    }



    // OUTPUT
    result.innerHTML = `

      <div class="weather-box">

        <h3>
          📍 ${lokasi.name}, ${lokasi.country}
        </h3>

        <p>
          🌡️ Suhu: 
          <b>${suhu}°C</b>
        </p>

        <p>
          🌦️ Kondisi: 
          <b>${kondisi}</b>
        </p>

        <p>
          💨 Kecepatan angin: 
          <b>${angin} km/j</b>
        </p>

        <p>
          🎯 ${rekomendasi}
        </p>

      </div>

    `;

  }

  catch(error){

    console.log(error);

    result.innerHTML = `
      <p>
        ❌ Terjadi error
      </p>
    `;

  }

}

</script>
